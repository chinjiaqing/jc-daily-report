<script>
  // 锚点平滑滚动：preventDefault 不产生新历史记录（后退一次即回上一页），replaceState 仅更新 URL hash
  function navAnchor(ev) {
    ev.preventDefault();
    var href = ev.currentTarget.getAttribute('href');
    var el = document.querySelector(href);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { history.replaceState(null, '', href); } catch (e) { /* 忽略 */ }
  }
  // 侧边锚点导航：滚动高亮当前区块
  (function () {
    var navItems = document.querySelectorAll('.side-nav a[href^="#"]');
    if (!navItems.length) return;
    var secs = document.querySelectorAll('main section[id], main div[id]');
    function spy() {
      var pos = window.scrollY + 140;
      var cur = null;
      for (var i = 0; i < secs.length; i++) { if (secs[i].offsetTop <= pos) cur = secs[i].id; }
      for (var j = 0; j < navItems.length; j++) {
        navItems[j].classList.toggle('is-active', navItems[j].getAttribute('href') === '#' + cur);
      }
    }
    window.addEventListener('scroll', spy, { passive: true });
    spy();
  })();
</script>
