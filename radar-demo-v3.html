let cur = -1;  // 初始选中由下方按 selDate 选定「首日首场」

let chart = null;
const dcls = v => v > 0.001 ? "text-up" : v < -0.001 ? "text-down" : "text-dim";
const arrow = v => v > 0.001 ? "▲" : v < -0.001 ? "▼" : "—";
const legCls = l => l === "h" ? "text-ch" : l === "d" ? "text-cd" : "text-ca";
const bj = t => { const d = new Date(t); return (d.getUTCMonth()+1) + "/" + d.getUTCDate() + " " + String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0"); };

function srcPts(){
  const m = M[cur];
  if (tab === "MED") return { name:"市场中位（全公司中位线）", pts:m.med };
  const c = m.comps.find(x => x.id === tab);
  return c ? { name:c.name + "（单家）", pts:c.pts } : { name:"市场中位（全公司中位线）", pts:m.med };
}

function renderTabs(){
  const m = M[cur];
  const items = [{id:"MED", name:"市场中位"}].concat(m.comps.map(c => ({id:c.id, name:c.name})));
  document.getElementById("tabs").innerHTML = items.map(it =>
    '<span class="tab ' + (tab===it.id?"on":"") + '" onclick="setTab(\'' + it.id + '\')">' + it.name + '</span>'
  ).join("");
}
function setTab(id){ tab = id; renderTabs(); drawChart(); }

function drawChart(){
  const s = srcPts();
  document.getElementById("srcName").textContent = s.name + " · " + s.pts.length + " 点";
  const labels = s.pts.map(p => bj(p.t));
  const ds = [
    {label:"主胜", data:s.pts.map(p=>p.h), borderColor:"#4ea1ff", borderWidth:tab==="MED"?1.8:1.4, pointRadius:0, tension:0.15},
    {label:"平局", data:s.pts.map(p=>p.d), borderColor:"#ffd166", borderWidth:1.2, pointRadius:0, tension:0.15},
    {label:"客胜", data:s.pts.map(p=>p.a), borderColor:"#ff6b6b", borderWidth:tab==="MED"?1.8:1.4, pointRadius:0, tension:0.15},
  ];
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type:"line", data:{labels, datasets:ds},
    options:{responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:"index", intersect:false},
      plugins:{legend:{labels:{color:"#8b93a7", boxWidth:10, font:{size:10}}, position:"top", align:"end"},
        tooltip:{backgroundColor:"#171c27", borderColor:"#232a38", borderWidth:1, titleColor:"#e6e9ef", bodyColor:"#e6e9ef", padding:8}},
      scales:{
        x:{ticks:{color:"#8b93a7", font:{size:9}, maxTicksLimit:8}, grid:{color:"#1a2130"}},
        y:{ticks:{color:"#8b93a7", font:{size:9}}, grid:{color:"#1a2130"}}
      }}
  });
}

function renderList(){
  const vis = M.map((m,i)=>i).filter(i => M[i].date === selDate);
  document.getElementById("listN").textContent = vis.length;
  if (!vis.length){
    document.getElementById("list").innerHTML = '<div class="px-3 py-4 text-dim text-[12px]">该日暂无比赛数据</div>';
    return;
  }
  document.getElementById("list").innerHTML = vis.map(i=>{
    const m = M[i];
    const ok = m.sig ? (m.sig.dir === "hd" ? m.sh >= m.sa : m.sa >= m.sh) : null;
    return '<div onclick="go('+i+')" class="cursor-pointer px-3 py-2 border-b border-line '+(i===cur?"bg-panel2 border-l-2 border-l-gold":"hover:bg-panel2")+'">'
    +'<div class="flex items-center gap-2"><span class="text-[10px] text-gold/80 mono">'+m.date.slice(5)+'</span>'
    +'<span class="text-[10px] text-dim mono">'+m.jc+'</span>'
    +'<span class="ml-auto mono text-[11px] '+(m.status==="finished"?(ok?"text-up":"text-down"):"text-dim")+'">'+(m.status==="finished"?m.sh+"-"+m.sa:"未赛")+'</span></div>'
    +'<div class="mt-0.5 text-[12px] truncate">'+m.home+' <span class="text-dim">vs</span> '+m.away+'</div>'
    +'<div class="mt-0.5 text-[10px] '+(m.sig?"text-gold":"text-dim")+'">'+(m.sig?m.sig.cn.split("·")[0]:"无信号")+' · '+(m.events?m.events.length:0)+' 异动 · '+m.ko+'</div></div>';

}

    const fmtDate = t => { const d = new Date(t); return p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate()); };
    const fmtHm = t => { const d = new Date(t); return p2(d.getUTCHours())+":"+p2(d.getUTCMinutes()); };
    const kindCls = k => k==="市场共振"?"text-gold":k==="单家背离"?"text-[#c77dff]":k==="突升"?"text-up":k==="突降"?"text-down":"text-dim";
    const groups = {};
    for (const e of evs.slice().sort((a,b)=>a.t-b.t)) { const ds = fmtDate(e.t); (groups[ds] = groups[ds] || []).push(e); }
    return Object.keys(groups).sort().map(ds => {
      const rows = groups[ds].map(e =>
        '<div class="flex items-start gap-1 py-0.5 border-b border-line/30">'
        +'<span class="text-dim mono text-[10px] shrink-0">'+fmtHm(e.t)+'</span>'
        +'<span class="px-1 shrink-0 '+kindCls(e.kind)+'">'+e.kind+'</span>'
        +'<span class="font-semibold shrink-0 '+legCls(e.leg)+'">'+e.legCN+'</span>'
        +'<span class="text-dim shrink-0">'+e.cname+'</span>'
        +'<span class="ml-auto mono shrink-0 '+(e.up?"text-up":"text-down")+'">'+e.from.toFixed(2)+'→'+e.to.toFixed(2)+' '+(e.up?"▲":"▼")+'</span></div>'
      ).join("");
      return '<div class="mb-1.5"><div class="text-[10px] font-semibold text-gold/90 px-1 py-0.5 bg-panel2/50 rounded-sm">'+ds+'</div>'+rows+'</div>';
    }).join("");
  })() : '<div class="text-dim px-1 py-2">无异动事件</div>';

  document.getElementById("ahBody").innerHTML = (m.ah||[]).length ? (
    m.ah.map(a=>qCard(a.name, ahQuadrant(a, m),
      '<div><div class="text-[10px] text-dim">初盘</div><div class="font-bold text-[14px] mono leading-none">'+a.line0.toFixed(2)+'</div><div class="text-[10px] text-dim">'+a.home0.toFixed(2)+'/'+a.away0.toFixed(2)+'</div></div>'
      +'<div><div class="text-[10px] text-dim">临场</div><div class="font-bold text-[14px] mono leading-none">'+a.line.toFixed(2)+'</div><div class="text-[10px] text-dim">'+a.home.toFixed(2)+'/'+a.away.toFixed(2)+'</div></div>'
      +'<div><div class="text-[10px] text-dim">变化</div><div class="text-[11px] mt-1 leading-snug">'+a.chg+'</div></div>'
    )).join("")
    + '<div class="text-[10px] text-dim mt-1 px-1 leading-relaxed">盘口=让球方门槛（主让/客让）· 水位=赔付　Q1升盘降水 · Q2升盘升水 · Q3降盘升水 · Q4降盘降水｜盘口不变看水位｜仅盘面解读，非下注判定</div>'
  ) : '<div class="px-2 py-3 text-dim text-[12px]">无亚盘</div>';

  document.getElementById("ouBody").innerHTML = (m.ou||[]).length ? (
    m.ou.map(o=>qCard(o.name, ouQuadrant(o),
      '<div><div class="text-[10px] text-dim">初盘</div><div class="font-bold text-[14px] mono leading-none">'+o.line0+'</div><div class="text-[10px] text-dim">大'+o.big0.toFixed(2)+'/小'+o.small0.toFixed(2)+'</div></div>'
      +'<div><div class="text-[10px] text-dim">临场</div><div class="font-bold text-[14px] mono leading-none">'+o.line+'</div><div class="text-[10px] text-dim">大'+o.big.toFixed(2)+'/小'+o.small.toFixed(2)+'</div></div>'
      +'<div><div class="text-[10px] text-dim">变化</div><div class="text-[11px] mt-1 leading-snug">'+o.chg+'</div></div>'
    )).join("")
    + '<div class="text-[10px] text-dim mt-1 px-1 leading-relaxed">盘口=进球门槛 · 基准=大球水位　Q1升盘降水(看大) · Q2升盘升水(偏大存疑) · Q3降盘升水(看小) · Q4降盘降水(反向看大)｜仅盘面解读，非下注判定</div>'
  ) : '<div class="px-2 py-3 text-dim text-[12px]">无大小球</div>';

  const ouHead = document.getElementById("ouHead");
  if (ouHead) ouHead.innerHTML = (m.ou&&m.ou.length) ? ('大小球 · '+m.ou[0].line.toFixed(2)+' <span class="ml-auto text-[10px] text-gold/80">Q4象限解读↓</span>') : '大小球 <span class="ml-auto text-[10px] text-gold/80">Q4象限解读↓</span>';

  if (m.sig) {
    const zh = {FAV:"正向区",BALANCED:"均衡区",COLD:"冷门区"}[m.zone]||m.zone||"-";
    document.getElementById("sigCard").innerHTML =
     '<div class="text-[10px] text-dim">当前信号（selected）</div>'
     +'<div class="mt-1 text-[15px] font-semibold text-gold">'+m.sig.cn+'</div>'
     +'<div class="mt-2 flex items-center gap-2"><span class="px-2 py-0.5 border border-line text-[11px]">'+(m.sig.dir==="hd"?"主不败":"客不败")+'</span>'
     +'<span class="text-[11px] text-dim">预测 '+m.sig.pred+'</span></div>'
     +'<div class="mt-3 space-y-1 text-[11px]">'
     +r("市场区间",zh)+r("均赔 H/D/A",(m.avgH!=null?m.avgH.toFixed(2):"-")+" / "+(m.avgD!=null?m.avgD.toFixed(2):"-")+" / "+(m.avgA!=null?m.avgA.toFixed(2):"-"))
     +r("主胜位移",(m.hShift!=null?(m.hShift>=0?"+":"")+m.hShift.toFixed(2):"-"))
     +r("ΔP 客胜",(m.dP?(m.dP.a*100).toFixed(1)+"pp":"-"))+r("平博概率 A",(m.sharp?(m.sharp.a*100).toFixed(0)+"%":"-"))+'</div>';
    document.getElementById("verdict").textContent = m.sig.id.replace(/_H$/,"");
  } else {
    document.getElementById("sigCard").innerHTML = '<div class="text-[10px] text-dim">当前信号</div><div class="mt-2 text-[14px] text-dim">无 V5 定稿信号</div><div class="mt-2 text-[11px] text-dim">未满足 4 条信号任一条件</div>';
    document.getElementById("verdict").textContent = "—";
  }

  document.getElementById("readme").innerHTML =
   '<div class="text-[10px] text-dim mb-1">解读（信号本体 · 不含下注建议）</div>'
   +README[cur].map(t=>'<div class="mb-1">· '+t+'</div>').join("")
   +'<div class="mt-2 pt-2 border-t border-line text-[11px] text-dim">赛果校验：'
   +(m.status==="finished"?(m.sig?('<b class="'+(ok?"text-up":"text-down")+'">'+(ok?"命中":"未中")+'</b>（'+m.sh+"-"+m.sa+"，判定口径="+(m.sig.dir==="hd"?"主不败":"客不败")+"）"):'<b class="text-dim">无信号</b>（本场未触发定稿信号，不判定命中/未中）'):"未开赛")+'</div>';

  if (tab !== "MED" && !m.comps.some(c => c.id === tab)) tab = "MED";
  renderTabs(); drawChart();
}
// —— 亚盘 Q4 象限解读器（仅解读，非判定）——
// 基准 = 让球方（负盘方）。line 更负 = 让球方让球更深 = 升盘；line 更正 = 降盘。
// 让球方水位 = 让球方一侧之水（line>0 主让取 home；line<0 客让取 away；line=0 平手参考主队）。
function ahLabel(line){
  const m={0:"平手",0.25:"平半",0.5:"半球",0.75:"半一",1:"一球",1.25:"一球半",1.5:"球半",1.75:"球半一",2:"两球",2.25:"两球半",2.5:"两球半",2.75:"两球半三球",3:"三球"};
  if(line>0) return "主让"+(m[line]||line);
  if(line<0) return "客让"+(m[-line]||(-line));
  return "平手";
}
function ahQuadrant(a, m){
  const ld = Math.abs(a.line) > Math.abs(a.line0) + 1e-6 ? "升盘" : (Math.abs(a.line) < Math.abs(a.line0) - 1e-6 ? "降盘" : "盘口不变");
  const favHome = a.line >= 0;                       // 让球方：line<0 客让；line>0 主让；line=0 平手参考主队
  const favName = a.line > 0 ? m.home : (a.line < 0 ? m.away : m.home);
  const w0 = favHome ? a.home0 : a.away0;
  const w  = favHome ? a.home  : a.away;
  const dw = w - w0;
  const wd = dw > 1e-4 ? "升水" : (dw < -1e-4 ? "降水" : "水不变");
  const li0 = ahLabel(a.line0), li = ahLabel(a.line);
  const lineChgTxt = li0 + (li0 !== li ? (" → " + li) : "");
  const waterChgTxt = (favHome ? "主水" : "客水") + w0.toFixed(2) + "→" + w.toFixed(2) + " " + wd;

  let q, act, intent, lean, note = "";
  if (ld === "升盘" && wd === "降水") {
    q="Q1"; act="升盘+降水（超强正向）";
    intent="让球门槛提高且赔付压低，双重控赔防范，资金极度看好让球方";
    lean="本象限典型解读倾向：正向看好让球方（上盘）。";
    note = (w <= 0.75 ? " 注：临场让球方水位≤0.75 超低水，需防“大热倒灶/赢球输盘”。" : "") + "（仅盘面解读，非判定）";
  } else if (ld === "升盘" && wd === "升水") {
    q="Q2"; act="升盘+升水（阻上/诱上并存）";
    intent="让球门槛提高但赔付不降反升，存在真阻上与诱上两种可能";
    lean="本象限典型解读倾向：常规偏让球方（真阻上），但方向存疑。";
    note = " 升盘+升水方向不单一，须结合该场热度判断，不构成判定。";
  } else if (ld === "降盘" && wd === "升水") {
    q="Q3"; act="降盘+升水（真实弃守）";
    intent="既降门槛又给高水，市场主力资金不在让球方，机构被动撤退";
    lean="本象限典型解读倾向：强烈利好受让方（下盘）。这与 DRIFT 弃守类信号为亚盘同构形态。";
    note = "（仅盘面解读，非判定）";
  } else if (ld === "降盘" && wd === "降水") {
    q="Q4"; act="降盘+降水（诱下/便宜没好货）";
    intent="降盘制造“让球方不行了”的恐慌诱导买下盘，同时给超低水锁死上盘赔付";
    lean="本象限典型解读倾向：反向看好让球方（上盘）。";
    note = "（仅盘面解读，非判定）";
  } else if (ld === "盘口不变") {
    q="—";
    if (wd === "降水") { act="盘口不变·让球方降水"; intent="资金涌入让球方，机构压低水位降低打出赔付"; lean="本象限典型解读倾向：正向利好让球方。"; }
    else if (wd === "升水") { act="盘口不变·让球方升水"; intent="受让方受资金追捧或让球方被冷落，机构抬高赔付平衡注码"; lean="本象限典型解读倾向：利好受让方（下盘）。"; }
    else { act="盘口不变·水不变"; intent="盘口与水位均无变化"; lean="无明显盘面异动。"; }
    note = "（仅盘面解读，非判定）";
  } else { q="—"; act=ld+"·"+wd; intent=""; lean=""; note="（仅盘面解读，非判定）"; }

  return { tag:(q==="—"?"盘":q), act, intent, lean, note, lineChgTxt, waterChgTxt };
}
// —— 大小球 Q4 象限解读器（仅解读，非判定）——
// 基准 = 大球（Over）。line 增大 = 进球门槛抬高 = 升盘；big = 大球赔付水位。
function ouQuadrant(o){
  const l0 = +o.line0, l = +o.line, b0 = +o.big0, b = +o.big;
  const ld = l > l0 + 1e-6 ? "升盘" : (l < l0 - 1e-6 ? "降盘" : "盘口不变");
  const dw = b - b0;
  const wd = dw > 1e-4 ? "升水" : (dw < -1e-4 ? "降水" : "水不变");
  const lineChgTxt = l0.toFixed(2) + (Math.abs(l - l0) > 1e-6 ? (" → " + l.toFixed(2)) : "");
  const waterChgTxt = "大球水 " + b0.toFixed(2) + "→" + b.toFixed(2) + " " + wd;

  let q, act, intent, lean, note = "";
  if (ld === "升盘" && wd === "降水") {
    q="Q1"; act="升盘+大球降水（强防大球/进球狂欢）";
    intent="进球门槛抬高且大球赔付压低，双重控赔，资金极度看好双方对攻";
    lean="本象限典型解读倾向：正向看好大球（Over）。极大概率分胜负、平局概率大幅压缩。";
    note = (b <= 0.75 ? " 注：临场大球水位≤0.75 超低水，需防大热倒灶/小球爆冷。" : "") + "（仅盘面解读，非判定）";
  } else if (ld === "升盘" && wd === "升水") {
    q="Q2"; act="升盘+大球升水（阻大球/诱大球并存）";
    intent="进球门槛抬高但大球赔付不降反升，存在真阻大球与诱大球两种可能";
    lean="本象限典型解读倾向：常规偏大球（真阻大），但若两队进攻名气极大却给超高水，须提防假大球。";
    note = " 升盘+大球升水方向不单一，须结合该场进攻属性判断，不构成判定。";
  } else if (ld === "降盘" && wd === "升水") {
    q="Q3"; act="降盘+大球升水（彻底闷战/真实弃守大球）";
    intent="既降进球门槛又给大球高水，市场主力资金不在大球，机构被动撤退";
    lean="本象限典型解读倾向：强烈看好小球（Under）。比分大概率锁定 0-0 / 1-0 / 1-1，平局与受让不败概率激增。";
    note = "（仅盘面解读，非判定）";
  } else if (ld === "降盘" && wd === "降水") {
    q="Q4"; act="降盘+大球降水（诱小球/降盘控赔）";
    intent="降盘制造“进球极少”的恐慌诱导买小球，同时大球超低水锁死大球打出赔付";
    lean="本象限典型解读倾向：反向看好大球（Over）。俗称“盘退水降，往往有球”。";
    note = "（仅盘面解读，非判定）";
  } else if (ld === "盘口不变") {
    q="—";
    if (wd === "降水") { act="盘口不变·大球降水"; intent="资金流入大球，机构压低水位降低打出赔付"; lean="本象限典型解读倾向：正向看好大球（Over）。"; }
    else if (wd === "升水") { act="盘口不变·大球升水"; intent="小球受资金追捧或机构抬高大球赔付平衡注码"; lean="本象限典型解读倾向：利好小球（Under）。"; }
    else { act="盘口不变·水不变"; intent="盘口与水位均无变化"; lean="无明显盘面异动。"; }
    note = "（仅盘面解读，非判定）";
  } else { q="—"; act=ld+"·"+wd; intent=""; lean=""; note="（仅盘面解读，非判定）"; }

  return { tag:(q==="—"?"盘":q), act, intent, lean, note, lineChgTxt, waterChgTxt };
}
const QSHORT = {Q1:"升盘降水", Q2:"升盘升水", Q3:"降盘升水", Q4:"降盘降水", "盘":"盘口不变"};
function qBadgeStyle(tag){
  if(tag==="Q1") return {c:"text-up", b:"bg-up/10", bd:"border-up/30"};
  if(tag==="Q2") return {c:"text-gold", b:"bg-gold/10", bd:"border-gold/30"};
  if(tag==="Q3") return {c:"text-down", b:"bg-down/10", bd:"border-down/30"};
  if(tag==="Q4") return {c:"text-ch", b:"bg-ch/10", bd:"border-ch/30"};
  return {c:"text-dim", b:"bg-panel2", bd:"border-line"};
}
function qCard(name, q, gridHtml){
  const st = qBadgeStyle(q.tag);
  const dim = q.tag === "盘";
  const badge = '<span class="ml-auto px-1.5 py-0.5 rounded border '+st.bd+' '+st.b+' '+st.c+' text-[10px] font-semibold whitespace-nowrap">'+q.tag+' · '+QSHORT[q.tag]+'</span>';
  return '<div class="rounded border border-line/60 bg-panel2/30 p-2 mb-2">'
    + '<div class="flex items-center gap-2"><span class="font-semibold text-[13px]">'+name+'</span>'+badge+'</div>'
    + '<div class="mt-1.5 grid grid-cols-3 gap-2 text-center">'+gridHtml+'</div>'
    + '<div class="mt-1.5 pt-1.5 border-t border-line/50">'
    +   '<div class="text-[12px] leading-snug font-medium '+(dim?"text-dim":st.c)+'">'+(dim?q.act:q.lean)+'</div>'
    +   '<div class="text-[11px] text-dim mt-0.5 leading-snug">'+(dim?q.intent:(q.intent+(q.note?" "+q.note:"")))+'</div>'
    + '</div></div>';
}
function r(k,v){return '<div class="flex justify-between"><span class="text-dim">'+k+'</span><span class="mono">'+v+'</span></div>';}
function go(i){cur=i;renderList();render();}

function p2b(n){return String(n).padStart(2,"0");}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+p2b(d.getMonth()+1)+"-"+p2b(d.getDate());}
function updateDateInfo(){
  const vis=M.filter(m=>m.date===selDate).length;
  const di=document.getElementById("dateInfo");
  if(di) di.innerHTML=selDate.slice(5)+" · 竞彩 <b class='text-[#e6e9ef] mono'>"+vis+"</b> 场";
  const ln=document.getElementById("listN"); if(ln) ln.textContent=vis;
  const ci=document.getElementById("calInput"); if(ci) ci.value=selDate;
}
function onDatePick(d){
  if(!d) return;
  selDate=d;
  const vis=M.map((m,i)=>i).filter(i=>M[i].date===selDate);
  cur = vis.length ? vis[0] : -1;   // 切换日期始终选中该日期首场（与进入逻辑一致）
  renderList(); render(); updateDateInfo();
}

const DATES=[...new Set(M.map(m=>m.date))].sort();
let selDate=todayStr();
if(!DATES.includes(selDate)) selDate = DATES[Math.min(1, DATES.length-1)] || DATES[0];
const _ci=document.getElementById("calInput"); if(_ci) _ci.value=selDate;
// 进入默认展示「当前日期首场」；若当前日期无比赛则取首个日期首场
{
  const vis = M.map((m,i)=>i).filter(i => M[i].date === selDate);
  cur = vis.length ? vis[0] : (M.length ? 0 : -1);
}
renderList(); render(); updateDateInfo();
</script>
